<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/site.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f2f2f2;
        }

        .navbar.fixed-top {
            top: 0 !important;
        }

        .thank-you-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .thank-you-box h1 {
            color: #28a745;
        }

        .thank-you-box p {
            margin: 20px 0;
        }

        .thank-you-box a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .thank-you-box a:hover {
            background-color: #0056b3;
        }

        nav a {
            text-decoration: none;
            color: darkblue
        }

        nav i {
            color: darkblue;
        }
    </style>
</head>

<body>
    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand" href="#">
                <img src="assets/images/debouchage-logo.png" alt="Logo" id="logo" class="img-fluid">
            </a>

            <!-- Navbar Toggler -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="contact-info">
                <i class="fas fa-phone-alt"></i> <a href="tel:+5144248467" class="mobile">(514) 424-8467</a>
                <i class="fas fa-envelope"></i> <a href="mailto:info@dbdor.com" class="email">info@dbdor.com</a>
            </div>
        </div>
    </nav>
    <div class="thank-you-box">
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully.</p>
        <a href="https://www.dbdor.com/mock">Go Back to Home</a>
    </div>

</body>

</html>
